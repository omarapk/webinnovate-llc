; PHP per-directory overrides (works on many shared hosts + PHP-FPM setups).
; Needed because multipart requests > 8MB currently fail before Laravel validation.

upload_max_filesize = 32M
post_max_size = 32M

; Optional: keep some headroom for slower uploads / remote storage calls.
max_execution_time = 180
max_input_time = 180
memory_limit = 256M
